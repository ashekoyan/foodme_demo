databases:
  - name: foodme-db
    plan: free
    databaseName: foodme
    user: foodme

services:
  - type: web
    name: foodme-ashekoyan
    runtime: docker
    plan: free
    # Rebuild and redeploy on every push to the tracked branch. This is also
    # Render's default, but it is stated explicitly here because the monitoring
    # blueprint deliberately sets the opposite (see render-monitoring.yaml).
    autoDeploy: true
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodme-db
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      # Frontend DSNs are read at build time (Vite). Render passes service env
      # vars into the Docker build as build args of the same name; the Dockerfile
      # maps each into the matching SPA build. Leave blank to disable.
      - key: VITE_SENTRY_DSN_WEB
        sync: false
      - key: VITE_SENTRY_DSN_ADMIN
        sync: false
      # Set AFTER render-monitoring.yaml is deployed, to the monitoring
      # service's PUBLIC push URL (Loki is served under /loki/ there):
      # https://foodme-monitoring-xxxx.onrender.com/loki/api/v1/push
      # (empty = log shipping disabled, the correct state until monitoring exists)
      # It must be the public *.onrender.com URL — free web services cannot
      # RECEIVE private network traffic, so foodme-monitoring:10000 never
      # resolves. See README.
      - key: LOKI_PUSH_URL
        sync: false
